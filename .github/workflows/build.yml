name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      apple_changed: ${{ steps.outputs.outputs.apple_changed }}
      android_changed: ${{ steps.outputs.outputs.android_changed }}
      version: ${{ steps.outputs.outputs.version }}
      build_number: ${{ steps.outputs.outputs.build_number }}
      play_version_code: ${{ steps.outputs.outputs.play_version_code }}
      library_hash: ${{ steps.outputs.outputs.library_hash }}
      app_store: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATES_P12 != '' }}
      developer_id: ${{ secrets.DEVELOPER_ID_CERTIFICATES_P12 != '' }}
      android: ${{ secrets.LOCAL_PROPERTIES != '' }}
      google_play: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Set outputs
        id: outputs
        run: |-
          if [ -n "$ASC_KEY" ]; then
            export ASC_KEY_PATH=$RUNNER_TEMP/ApiKey_$ASC_KEY_ID.p8
            echo -n "$ASC_KEY" | base64 --decode > "$ASC_KEY_PATH"
            VERSION=$(go run ./cmd/internal/app_store_connect next_marketing_version "$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')")
            echo "version=$VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ANDROID_PUBLISHER_CREDENTIALS" ]; then
            PLAY_VERSION_CODE=$(go run ./cmd/internal/google_play next_version_code)
            echo "play_version_code=$PLAY_VERSION_CODE"
            echo "play_version_code=$PLAY_VERSION_CODE" >> "$GITHUB_OUTPUT"
          fi
          PREVIOUS=0
          APPLE_CHANGED=true
          ANDROID_CHANGED=true
          if git fetch --depth=1 origin tag nightly; then
            PREVIOUS=$(git tag -l --format='%(contents:subject)' nightly)
            RELEASED=$(curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/metadata.json" | jq -r '"\(.version) \(.nightly)"' || true)
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$RELEASED" = "$VERSION $PREVIOUS" ]; then
              UNBUILT_PATHS=(':!.github' ':!assets' ':!*.md' ':!LICENSE' ':!.gitignore' ':!*_test.go' ':!cmd/internal/app_store_connect' ':!cmd/internal/build_android_strings'
                ':!cmd/internal/format_xcstrings' ':!cmd/internal/google_play' ':!cmd/internal/screenshots*')
              if git diff --quiet 'nightly^{commit}' HEAD -- . "${UNBUILT_PATHS[@]}" ':!OpenScreenSharingAndroid' ':!*.gradle.kts' ':!gradle*'; then
                APPLE_CHANGED=false
              fi
              if git diff --quiet 'nightly^{commit}' HEAD -- . "${UNBUILT_PATHS[@]}" ':!OpenScreenSharing' ':!OpenScreenSharing.xcodeproj' ':!cmd/internal/build_altstore_source'; then
                ANDROID_CHANGED=false
              fi
            fi
          fi
          echo "apple_changed=$APPLE_CHANGED android_changed=$ANDROID_CHANGED"
          echo "apple_changed=$APPLE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "android_changed=$ANDROID_CHANGED" >> "$GITHUB_OUTPUT"
          echo "build_number=$((PREVIOUS + 1))"
          echo "build_number=$((PREVIOUS + 1))" >> "$GITHUB_OUTPUT"
          echo "library_hash=${{ hashFiles('go.mod', 'go.sum', 'libsharing/**', 'internal/**', 'cmd/internal/build_libsharing/**') }}" >> "$GITHUB_OUTPUT"
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          GH_TOKEN: ${{ github.token }}
  build_apple_library:
    name: Build Apple library (${{ matrix.artifact }})
    if: needs.calculate_version.outputs.apple_changed == 'true'
    runs-on: xcode-27
    needs:
      - calculate_version
    strategy:
      matrix:
        include:
          - artifact: ios-arm64
            target: ios/arm64
          - artifact: macos
            target: macos
    steps:
      - name: Cache library
        id: library
        uses: actions/cache@v4
        with:
          path: Frameworks/Libsharing.xcframework
          key: libsharing-${{ matrix.artifact }}-${{ needs.calculate_version.outputs.library_hash }}
          lookup-only: true
      - name: Checkout
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Select Xcode
        if: steps.library.outputs.cache-hit != 'true'
        run: .github/select_xcode.sh
      - name: Setup Go
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-
      - name: Cache Go build
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/go-build
          key: go-build-libsharing-${{ matrix.artifact }}-${{ needs.calculate_version.outputs.library_hash }}
          restore-keys: go-build-libsharing-${{ matrix.artifact }}-
      - name: Build library
        if: steps.library.outputs.cache-hit != 'true'
        run: go run ./cmd/internal/build_libsharing -target ${{ matrix.target }}
  build_ios:
    name: Build iOS (App Store)
    if: needs.calculate_version.outputs.app_store == 'true'
    runs-on: xcode-27
    needs:
      - calculate_version
      - build_apple_library
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Select Xcode
        run: .github/select_xcode.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-
      - name: Install Apple provisioning profiles
        run: |-
          PROFILES_ZIP_PATH=$RUNNER_TEMP/AppleProvisioningProfiles.zip
          echo -n "$APPLE_PROVISIONING_PROFILES" | base64 --decode -o "$PROFILES_ZIP_PATH"
          PROFILES_PATH="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_PATH"
          unzip -q "$PROFILES_ZIP_PATH" -d "$PROFILES_PATH"
        env:
          APPLE_PROVISIONING_PROFILES: ${{ secrets.APPLE_PROVISIONING_PROFILES }}
      - name: Setup Apple certificates
        run: |-
          KEYCHAIN_PATH=$RUNNER_TEMP/apple-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_DEVELOPMENT_CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/AppleDevelopment.p12"
          echo -n "$APPLE_DISTRIBUTION_CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/AppleDistribution.p12"
          security import "$RUNNER_TEMP/AppleDevelopment.p12" -P "$APPLE_DEVELOPMENT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/AppleDistribution.p12" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        env:
          APPLE_DEVELOPMENT_CERTIFICATES_P12: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATES_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          APPLE_DISTRIBUTION_CERTIFICATES_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATES_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      - name: Setup App Store Connect key
        run: |-
          ASC_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys
          mkdir -p "$ASC_PRIVATE_KEYS_DIR"
          ASC_KEY_PATH=$ASC_PRIVATE_KEYS_DIR/ApiKey_$ASC_KEY_ID.p8
          echo -n "$ASC_KEY" | base64 --decode -o "$ASC_KEY_PATH"
          {
            echo "API_PRIVATE_KEYS_DIR=$ASC_PRIVATE_KEYS_DIR"
            echo "ASC_KEY_PATH=$ASC_KEY_PATH"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
          } >> "$GITHUB_ENV"
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      - name: Calculate project version
        run: |-
          PROJECT_VERSION=$(go run ./cmd/internal/app_store_connect next_project_version "${{ needs.calculate_version.outputs.version }}")
          echo "PROJECT_VERSION=$PROJECT_VERSION"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"
      - name: Restore library
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/Libsharing.xcframework
          key: libsharing-ios-arm64-${{ needs.calculate_version.outputs.library_hash }}
          fail-on-cache-miss: true
      - name: Get Xcode version
        id: xcode
        run: echo "build=$(xcodebuild -version | tail -1 | cut -d ' ' -f 3)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: swift-app-store-${{ steps.xcode.outputs.build }}-${{ hashFiles('OpenScreenSharing/**', 'OpenScreenSharing.xcodeproj/**', 'Frameworks/Libsharing.xcframework/ios-arm64/Libsharing.framework/Versions/A/Headers/**', 'Frameworks/Libsharing.xcframework/ios-arm64/Libsharing.framework/Versions/A/Modules/**') }}
          restore-keys: swift-app-store-${{ steps.xcode.outputs.build }}-
      - name: Build
        run: make archive_ios export_ios
        env:
          XCODEBUILD_FLAGS: MARKETING_VERSION=${{ needs.calculate_version.outputs.version }} CURRENT_PROJECT_VERSION=${{ env.PROJECT_VERSION }} COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/CompilationCache COMPILATION_CACHE_LIMIT_SIZE=2G
      - name: Upload to App Store Connect
        run: |-
          xcrun altool --upload-app \
            -f build/OpenScreenSharing-iOS/*.ipa \
            -t ios \
            --api-key "$ASC_KEY_ID" \
            --api-issuer 00000000-0000-0000-0000-000000000000
  build_ios_ipa:
    name: Build iOS (IPA)
    runs-on: xcode-27
    needs:
      - calculate_version
      - build_apple_library
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Select Xcode
        run: .github/select_xcode.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-
      - name: Restore library
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/Libsharing.xcframework
          key: libsharing-ios-arm64-${{ needs.calculate_version.outputs.library_hash }}
          fail-on-cache-miss: true
      - name: Get Xcode version
        id: xcode
        run: echo "build=$(xcodebuild -version | tail -1 | cut -d ' ' -f 3)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: swift-sideload-${{ steps.xcode.outputs.build }}-${{ hashFiles('OpenScreenSharing/**', 'OpenScreenSharing.xcodeproj/**', 'Frameworks/Libsharing.xcframework/ios-arm64/Libsharing.framework/Versions/A/Headers/**', 'Frameworks/Libsharing.xcframework/ios-arm64/Libsharing.framework/Versions/A/Modules/**') }}
          restore-keys: swift-sideload-${{ steps.xcode.outputs.build }}-
      - name: Build
        run: make archive_ios_ipa altstore_source
        env:
          XCODEBUILD_FLAGS: ${{ needs.calculate_version.outputs.version && format('MARKETING_VERSION={0} ', needs.calculate_version.outputs.version) }}CURRENT_PROJECT_VERSION=${{ needs.calculate_version.outputs.build_number }} COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/CompilationCache COMPILATION_CACHE_LIMIT_SIZE=2G
      - name: Package dSYMs
        run: ditto -c -k --keepParent build/OpenScreenSharing-Sideload.xcarchive/dSYMs build/OpenScreenSharing-iOS.dSYMs.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenSharing-iOS-IPA
          path: |-
            build/OpenScreenSharing.ipa
            build/OpenScreenSharing-iOS.dSYMs.zip
            build/altstore
          if-no-files-found: error
  build_macos:
    name: Build macOS
    if: needs.calculate_version.outputs.developer_id == 'true'
    runs-on: xcode-27
    needs:
      - calculate_version
      - build_apple_library
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Select Xcode
        run: .github/select_xcode.sh
      - name: Setup Apple certificates
        run: |-
          KEYCHAIN_PATH=$RUNNER_TEMP/apple-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_DEVELOPMENT_CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/AppleDevelopment.p12"
          echo -n "$DEVELOPER_ID_CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/DeveloperID.p12"
          security import "$RUNNER_TEMP/AppleDevelopment.p12" -P "$APPLE_DEVELOPMENT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperID.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_DEVELOPMENT_CERTIFICATES_P12: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATES_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          DEVELOPER_ID_CERTIFICATES_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATES_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      - name: Setup notarization credentials
        run: |-
          ASC_KEY_PATH=$RUNNER_TEMP/ApiKey_$ASC_KEY_ID.p8
          echo -n "$ASC_KEY" | base64 --decode -o "$ASC_KEY_PATH"
          # store-credentials prompts for the issuer ID even when --issuer is absent;
          # an empty answer selects individual key authentication.
          printf '\n' | xcrun notarytool store-credentials "notarytool-password" \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --keychain "$KEYCHAIN_PATH"
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      - name: Restore library
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/Libsharing.xcframework
          key: libsharing-macos-${{ needs.calculate_version.outputs.library_hash }}
          fail-on-cache-miss: true
      - name: Get Xcode version
        id: xcode
        run: echo "build=$(xcodebuild -version | tail -1 | cut -d ' ' -f 3)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: swift-macos-${{ steps.xcode.outputs.build }}-${{ hashFiles('OpenScreenSharing/**', 'OpenScreenSharing.xcodeproj/**', 'Frameworks/Libsharing.xcframework/macos-arm64_x86_64/Libsharing.framework/Versions/A/Headers/**', 'Frameworks/Libsharing.xcframework/macos-arm64_x86_64/Libsharing.framework/Versions/A/Modules/**') }}
          restore-keys: swift-macos-${{ steps.xcode.outputs.build }}-
      - name: Build
        run: make archive_macos export_macos build_macos_pkg notarize_macos_pkg
        env:
          XCODEBUILD_FLAGS: MARKETING_VERSION=${{ needs.calculate_version.outputs.version }} CURRENT_PROJECT_VERSION=${{ needs.calculate_version.outputs.build_number }} COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/CompilationCache COMPILATION_CACHE_LIMIT_SIZE=2G
      - name: Package dSYMs
        run: ditto -c -k --keepParent build/OpenScreenSharing-macOS.xcarchive/dSYMs build/OpenScreenSharing-macOS.dSYMs.zip
      - name: Write metadata
        run: |-
          INFO_PLIST="build/OpenScreenSharing-macOS/Open Screen Sharing.app/Contents/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$INFO_PLIST")
          BUILD=$(plutil -extract CFBundleVersion raw "$INFO_PLIST")
          printf '{"version":"%s","build":%s}\n' "$VERSION" "$BUILD" > build/metadata.json
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenSharing-macOS-PKG
          path: |-
            build/OpenScreenSharing.pkg
            build/OpenScreenSharing-macOS.dSYMs.zip
            build/metadata.json
          if-no-files-found: error
  build_android_library:
    name: Build Android library
    if: needs.calculate_version.outputs.android == 'true' && needs.calculate_version.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    needs:
      - calculate_version
    steps:
      - name: Cache library
        id: library
        uses: actions/cache@v4
        with:
          path: OpenScreenSharingAndroid/libs/libsharing.aar
          key: libsharing-android-${{ needs.calculate_version.outputs.library_hash }}
          lookup-only: true
      - name: Checkout
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Setup Go
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-
      - name: Cache Go build
        if: steps.library.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-libsharing-android-${{ needs.calculate_version.outputs.library_hash }}
          restore-keys: go-build-libsharing-android-
      - name: Build library
        if: steps.library.outputs.cache-hit != 'true'
        run: go run ./cmd/internal/build_libsharing -target android
  build_android:
    name: Build Android
    if: needs.calculate_version.outputs.android == 'true'
    runs-on: ubuntu-latest
    needs:
      - calculate_version
      - build_android_library
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Restore library
        uses: actions/cache/restore@v4
        with:
          path: OpenScreenSharingAndroid/libs/libsharing.aar
          key: libsharing-android-${{ needs.calculate_version.outputs.library_hash }}
          fail-on-cache-miss: true
      - name: Build
        run: make archive_android
        env:
          GRADLE_FLAGS: ${{ needs.calculate_version.outputs.version && format('-PversionName={0} ', needs.calculate_version.outputs.version) }}-PversionCode=${{ needs.calculate_version.outputs.build_number }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenSharing-Android-APK
          path: |-
            build/OpenScreenSharing-arm64-v8a.apk
            build/OpenScreenSharing-armeabi-v7a.apk
            build/OpenScreenSharing-x86_64.apk
            build/OpenScreenSharing-universal.apk
          if-no-files-found: error
      - name: Upload to Google Play
        if: needs.calculate_version.outputs.google_play == 'true'
        run: make upload_android
        env:
          GRADLE_FLAGS: ${{ needs.calculate_version.outputs.version && format('-PversionName={0} ', needs.calculate_version.outputs.version) }}-PversionCode=${{ needs.calculate_version.outputs.play_version_code }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
  publish_nightly:
    name: Publish nightly
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() && !failure()
      && (needs.calculate_version.outputs.apple_changed == 'true' || needs.calculate_version.outputs.android_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - calculate_version
      - build_ios_ipa
      - build_macos
      - build_android
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: OpenScreenSharing-*
          merge-multiple: true
          path: dist
      - name: Publish
        run: |-
          if RELEASE=$(gh release view --json tagName --jq .tagName); then
            NOTES=$(git log --format='* %s' "$RELEASE..")
          else
            NOTES=$(git log --format='* %s')
          fi
          UNCHANGED=()
          if [ "$APPLE_CHANGED" = false ]; then
            UNCHANGED+=(-p OpenScreenSharing.ipa -p OpenScreenSharing.pkg -p 'OpenScreenSharing-*.dSYMs.zip' -p altstore.json -p icon.png -p metadata.json)
          fi
          if [ "$ANDROID_CHANGED" = false ]; then
            UNCHANGED+=(-p 'OpenScreenSharing-*.apk')
          fi
          if [ ${#UNCHANGED[@]} -gt 0 ]; then
            gh release download nightly -D dist "${UNCHANGED[@]}"
          fi
          if [ -f dist/metadata.json ]; then
            METADATA=$(jq -c --argjson nightly "$BUILD_NUMBER" '.nightly = $nightly' dist/metadata.json)
            echo "$METADATA" > dist/metadata.json
          fi
          mapfile -t ASSETS < <(find dist -type f)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a -f nightly -m "$BUILD_NUMBER" "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          gh release create "nightly-$BUILD_NUMBER" --draft --prerelease --target "$GITHUB_SHA" --title "Nightly build" --notes "$NOTES" "${ASSETS[@]}"
          DRAFT=$(gh release view "nightly-$BUILD_NUMBER" --json apiUrl --jq .apiUrl)
          if PREVIOUS=$(gh release view nightly --json apiUrl --jq .apiUrl); then
            gh api -X DELETE "$PREVIOUS"
          fi
          gh api -X PATCH "$DRAFT" -f tag_name=nightly -F draft=false > /dev/null
        env:
          APPLE_CHANGED: ${{ needs.calculate_version.outputs.apple_changed }}
          ANDROID_CHANGED: ${{ needs.calculate_version.outputs.android_changed }}
          BUILD_NUMBER: ${{ needs.calculate_version.outputs.build_number }}
          GH_TOKEN: ${{ github.token }}
  move_nightly:
    name: Move nightly
    if: github.ref == 'refs/heads/main' && needs.calculate_version.outputs.apple_changed == 'false' && needs.calculate_version.outputs.android_changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - calculate_version
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Move tag
        run: |-
          git fetch --depth=1 origin tag nightly
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a -f nightly -m "$(git tag -l --format='%(contents:subject)' nightly)" "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
  prune_caches:
    name: Prune caches
    if: >-
      github.ref == 'refs/heads/main' && !cancelled()
      && (needs.calculate_version.outputs.apple_changed == 'true' || needs.calculate_version.outputs.android_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    needs:
      - calculate_version
      - build_ios
      - build_ios_ipa
      - build_macos
      - build_android
    steps:
      - name: Delete superseded caches
        run: |-
          CACHES=$(gh cache list --ref "$GITHUB_REF" --limit 1000 --json id,key \
            --jq 'group_by(.key | sub("-[^-]*$"; "")) | map(.[1:]) | flatten | .[].id')
          for cache in $CACHES; do
            gh cache delete "$cache"
          done
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
